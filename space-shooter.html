<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별빛 요격</title>
<style>
  :root{
    --bg-0:#05070d;
    --bg-1:#0b1020;
    --accent:#5ee7ff;
    --accent-2:#ff5e8f;
    --accent-3:#ffd75e;
    --text:#e8f1ff;
    --text-dim:#7f8bab;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-1), var(--bg-0) 70%);
    color: var(--text);
    font-family: 'Segoe UI', 'Pretendard', -apple-system, sans-serif;
    overflow:hidden;
  }
  #wrap{
    display:flex; flex-direction:column; align-items:center;
    width:100%; height:100vh; justify-content:center;
    gap:12px;
    padding:12px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:1px;
    color: var(--text);
    text-shadow: 0 0 18px rgba(94,231,255,0.5);
  }
  #hud{
    display:flex; justify-content:space-between; align-items:center;
    width:min(720px, 94vw);
    font-size:14px;
    color: var(--text-dim);
  }
  #hud b{ color: var(--accent); font-weight:700; }
  #hud .life{ color: var(--accent-2); font-weight:700; }
  #stage{
    position:relative;
    width:min(720px, 94vw);
    aspect-ratio: 3/4;
    max-height: 74vh;
    border-radius: 14px;
    overflow:hidden;
    background: linear-gradient(180deg, #060913 0%, #0a0e1c 100%);
    box-shadow: 0 0 0 1px rgba(94,231,255,0.15), 0 20px 60px rgba(0,0,0,0.6);
  }
  canvas{
    display:block;
    width:100%; height:100%;
  }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background: rgba(5,7,13,0.82);
    backdrop-filter: blur(2px);
    text-align:center;
    padding: 24px;
  }
  #overlay.hidden{ display:none; }
  #overlay h2{
    font-size:26px;
    letter-spacing:0.5px;
  }
  #overlay p{
    color: var(--text-dim);
    font-size:14px;
    line-height:1.6;
    max-width: 420px;
  }
  button{
    appearance:none; border:none; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:15px;
    color:#05070d;
    background: linear-gradient(135deg, var(--accent), #8ef3ff);
    padding: 12px 28px;
    border-radius: 999px;
    box-shadow: 0 6px 24px rgba(94,231,255,0.35);
    transition: transform 0.15s ease;
  }
  button:active{ transform: scale(0.96); }
  #controls-hint{
    font-size:12px;
    color: var(--text-dim);
    text-align:center;
  }
  #touch-controls{
    display:none;
    width:min(720px, 94vw);
    justify-content:space-between;
    gap:10px;
  }
  .tbtn{
    flex:1;
    height:56px;
    border-radius:12px;
    background: rgba(94,231,255,0.08);
    border: 1px solid rgba(94,231,255,0.25);
    color: var(--accent);
    font-size:20px;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }
  @media (pointer:coarse){
    #touch-controls{ display:flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>별빛 요격 <span style="color:var(--text-dim); font-weight:400; font-size:14px;">STARLIGHT INTERCEPT</span></h1>
  <div id="hud">
    <div>점수 <b id="score">0</b></div>
    <div id="wave-label">웨이브 1</div>
    <div class="life">생명 <span id="lives">♥♥♥</span></div>
  </div>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">별빛 요격</h2>
      <p id="overlay-text">방향키 또는 A/D로 이동, 스페이스바로 발사하세요.<br>내려오는 적을 격추하고 최고 점수에 도전하세요.</p>
      <button id="start-btn">게임 시작</button>
    </div>
  </div>
  <div id="touch-controls">
    <div class="tbtn" id="btn-left">◀</div>
    <div class="tbtn" id="btn-fire">●</div>
    <div class="tbtn" id="btn-right">▶</div>
  </div>
  <div id="controls-hint">← → / A D 이동 · Space 발사 · P 일시정지</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start-btn');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const waveLabel = document.getElementById('wave-label');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  // ---- state ----
  let running = false, paused = false;
  let score = 0, lives = 3, wave = 1;
  let player, bullets, enemyBullets, enemies, particles, stars;
  let lastTime = 0, spawnTimer = 0, waveTimer = 0;
  let keys = {};

  function initStars(){
    stars = [];
    for(let i=0;i<70;i++){
      stars.push({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.6+0.3,
        s: Math.random()*40+15
      });
    }
  }

  function initGame(){
    score = 0; lives = 3; wave = 1;
    player = {
      x: W/2, y: H-50, w: 34, h: 30,
      speed: 260, cooldown: 0, invuln: 0
    };
    bullets = [];
    enemyBullets = [];
    enemies = [];
    particles = [];
    spawnTimer = 0;
    waveTimer = 0;
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = score;
    livesEl.textContent = '♥'.repeat(Math.max(lives,0)) + '♡'.repeat(Math.max(3-lives,0));
    waveLabel.textContent = '웨이브 ' + wave;
  }

  function spawnEnemy(){
    const type = Math.random() < 0.18 ? 'shooter' : 'drone';
    const w = type==='shooter' ? 30 : 26;
    enemies.push({
      x: Math.random()*(W-w*2)+w,
      y: -30,
      w, h: w,
      type,
      speed: (type==='shooter'? 55 : 75) + wave*4,
      hp: type==='shooter'? 2 : 1,
      wob: Math.random()*Math.PI*2,
      fireCd: Math.random()*2+1
    });
  }

  function rectsHit(a,b){
    return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2;
  }

  function spawnParticles(x,y,color,n){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2;
      const sp = Math.random()*120+40;
      particles.push({
        x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: Math.random()*0.4+0.3, maxLife: 0.7, color
      });
    }
  }

  function endGame(win){
    running = false;
    overlay.classList.remove('hidden');
    overlayTitle.textContent = '게임 오버';
    overlayText.innerHTML = `최종 점수 <b style="color:var(--accent)">${score}</b> · 웨이브 ${wave}<br>다시 도전해보세요!`;
    startBtn.textContent = '다시 시작';
  }

  function update(dt){
    if(paused) return;

    // player movement
    let dir = 0;
    if(keys['ArrowLeft']||keys['a']||keys['A']) dir -= 1;
    if(keys['ArrowRight']||keys['d']||keys['D']) dir += 1;
    player.x += dir * player.speed * dt;
    player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));

    player.cooldown -= dt;
    if((keys[' ']||keys['Spacebar']) && player.cooldown<=0){
      bullets.push({x:player.x, y:player.y-player.h/2, w:4, h:12, speed:480});
      player.cooldown = 0.22;
    }
    if(player.invuln>0) player.invuln -= dt;

    // spawn logic
    spawnTimer -= dt;
    waveTimer += dt;
    const spawnInterval = Math.max(1.6 - wave*0.08, 0.5);
    if(spawnTimer<=0){
      spawnEnemy();
      spawnTimer = spawnInterval * (0.7+Math.random()*0.6);
    }
    if(waveTimer > 14){
      wave += 1;
      waveTimer = 0;
      updateHUD();
    }

    // bullets
    bullets.forEach(b=> b.y -= b.speed*dt);
    bullets = bullets.filter(b=> b.y > -20);

    enemyBullets.forEach(b=>{ b.y += b.speed*dt; });
    enemyBullets = enemyBullets.filter(b=> b.y < H+20);

    // enemies
    enemies.forEach(e=>{
      e.wob += dt*3;
      e.x += Math.sin(e.wob)*22*dt;
      e.y += e.speed*dt;
      if(e.type==='shooter'){
        e.fireCd -= dt;
        if(e.fireCd<=0 && e.y>0 && e.y<H*0.7){
          enemyBullets.push({x:e.x,y:e.y+e.h/2,w:4,h:10,speed:220});
          e.fireCd = 1.6+Math.random();
        }
      }
    });

    // enemy reaches bottom
    enemies.forEach(e=>{
      if(e.y > H+30){
        e.dead = true;
        loseLife();
      }
    });

    // collisions: player bullets vs enemies
    bullets.forEach(b=>{
      enemies.forEach(e=>{
        if(!e.dead && !b.hit && rectsHit(b,e)){
          b.hit = true;
          e.hp -= 1;
          if(e.hp<=0){
            e.dead = true;
            score += e.type==='shooter'? 20:10;
            spawnParticles(e.x,e.y, e.type==='shooter'?'#ff5e8f':'#5ee7ff', 14);
            updateHUD();
          }
        }
      });
    });
    bullets = bullets.filter(b=>!b.hit);
    enemies = enemies.filter(e=>!e.dead);

    // enemy bullets vs player
    if(player.invuln<=0){
      enemyBullets.forEach(b=>{
        if(rectsHit(b,player)){
          b.hit = true;
          loseLife();
        }
      });
    }
    enemyBullets = enemyBullets.filter(b=>!b.hit);

    // enemies vs player (collision)
    if(player.invuln<=0){
      enemies.forEach(e=>{
        if(rectsHit(e,player)){
          e.dead = true;
          spawnParticles(e.x,e.y,'#ffd75e',14);
          loseLife();
        }
      });
      enemies = enemies.filter(e=>!e.dead);
    }

    // particles
    particles.forEach(p=>{
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= dt;
    });
    particles = particles.filter(p=>p.life>0);

    // stars
    stars.forEach(s=>{
      s.y += s.s*dt;
      if(s.y>H){ s.y=0; s.x=Math.random()*W; }
    });
  }

  function loseLife(){
    if(player.invuln>0) return;
    lives -= 1;
    player.invuln = 1.5;
    spawnParticles(player.x, player.y, '#ff5e8f', 20);
    updateHUD();
    if(lives<=0){
      endGame(false);
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // stars
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    stars.forEach(s=>{
      ctx.globalAlpha = 0.3 + Math.random()*0.1;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // player
    if(!(player.invuln>0 && Math.floor(player.invuln*10)%2===0)){
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.fillStyle = '#5ee7ff';
      ctx.shadowColor = '#5ee7ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0,-player.h/2);
      ctx.lineTo(player.w/2, player.h/2);
      ctx.lineTo(0, player.h/4);
      ctx.lineTo(-player.w/2, player.h/2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // bullets
    ctx.fillStyle = '#ffd75e';
    ctx.shadowColor = '#ffd75e';
    ctx.shadowBlur = 8;
    bullets.forEach(b=> ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));

    ctx.fillStyle = '#ff5e8f';
    ctx.shadowColor = '#ff5e8f';
    enemyBullets.forEach(b=> ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h));
    ctx.shadowBlur = 0;

    // enemies
    enemies.forEach(e=>{
      ctx.save();
      ctx.translate(e.x,e.y);
      ctx.fillStyle = e.type==='shooter' ? '#ff5e8f' : '#8ef3ff';
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(0, e.h/2);
      ctx.lineTo(e.w/2, -e.h/2);
      ctx.lineTo(0, -e.h/4);
      ctx.lineTo(-e.w/2, -e.h/2);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    });
    ctx.shadowBlur = 0;

    // particles
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life/p.maxLife,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop(t){
    if(!lastTime) lastTime = t;
    const dt = Math.min((t-lastTime)/1000, 0.05);
    lastTime = t;
    if(running){
      update(dt);
      draw();
    }
    requestAnimationFrame(loop);
  }

  // input
  window.addEventListener('keydown', e=>{
    keys[e.key] = true;
    if(e.key===' ') e.preventDefault();
    if((e.key==='p'||e.key==='P') && running){
      paused = !paused;
    }
  });
  window.addEventListener('keyup', e=>{ keys[e.key] = false; });

  // touch controls
  function bindHold(id, key){
    const el = document.getElementById(id);
    const set = v => e => { keys[key]=v; e.preventDefault(); };
    el.addEventListener('touchstart', set(true), {passive:false});
    el.addEventListener('touchend', set(false), {passive:false});
    el.addEventListener('mousedown', set(true));
    el.addEventListener('mouseup', set(false));
    el.addEventListener('mouseleave', set(false));
  }
  bindHold('btn-left','ArrowLeft');
  bindHold('btn-right','ArrowRight');
  bindHold('btn-fire',' ');

  startBtn.addEventListener('click', ()=>{
    overlay.classList.add('hidden');
    resize();
    initStars();
    initGame();
    running = true; paused = false;
  });

  // initial sizing
  requestAnimationFrame(()=>{
    resize();
    initStars();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
